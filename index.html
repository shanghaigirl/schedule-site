<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: #fafaf7;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 1rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #e8e8e3; }
    .lock h1 { color: #999; }
    .lock label { color: #999; }
    .lock input[type="password"] {
      background: #2a2a2a; color: #e8e8e3; border-color: #3a3a3a;
    }
    .lock input[type="password"]:focus { border-color: #8fb89b; }
    .lock button { background: #8fb89b; color: #1a1a1a; }
    .lock button:hover { background: #a4c5af; }
  }
  .lock {
    text-align: center;
    width: 100%;
    max-width: 320px;
  }
  .lock h1 {
    font-size: 1rem;
    font-weight: 500;
    margin: 0 0 1.25rem;
    color: #6b6b6b;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .lock input[type="password"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d0d0c8;
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    margin-bottom: 0.75rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .lock input[type="password"]:focus { border-color: #4a7c59; }
  .lock label {
    display: block;
    font-size: 0.85rem;
    color: #6b6b6b;
    margin-bottom: 1rem;
    cursor: pointer;
    user-select: none;
  }
  .lock label input { margin-right: 0.4rem; }
  .lock button {
    width: 100%;
    padding: 0.75rem;
    background: #4a7c59;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: background 0.15s;
    font-weight: 500;
  }
  .lock button:hover { background: #3d6648; }
  .err {
    color: #b85450;
    font-size: 0.85rem;
    margin-top: 0.75rem;
    min-height: 1.2rem;
  }
</style>

</div>

function b64ToU8(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

  const ciphertext = b64ToU8(DATA.c);

  const passKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    passKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv },
    key,
    ciphertext
  );
  return new TextDecoder().decode(decrypted);
}

async function unlock(pwd, isAuto) {
  pwd = pwd || document.getElementById('pwd').value;
  if (!pwd) return;
  try {
    const html = await decrypt(pwd);
    if (!isAuto && document.getElementById('remember').checked) {
      localStorage.setItem('site-password', pwd);
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    if (!isAuto) {
      document.getElementById('err').textContent = 'Wrong password';
    }
    localStorage.removeItem('site-password');
  }
}

document.getElementById('btn').addEventListener('click', () => unlock());
document.getElementById('pwd').addEventListener('keypress', e => {
  if (e.key === 'Enter') unlock();
});

const saved = localStorage.getItem('site-password');
if (saved) unlock(saved, true);
</script>
